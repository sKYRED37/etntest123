[build]
  publish = "web"

# Send API requests from Netlify to the Bothost backend.
[[redirects]]
  from = "/api/*"
  to = "https://bot-1791912701-5353-skyred123.bothost.tech/api/:splat"
  status = 200
  force = true

# Serve the single-page app for other paths (prevents Netlify 404s).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
